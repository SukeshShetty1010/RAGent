# ============================================================
# RAGent — Render Infrastructure-as-Code
# ============================================================
# Deploy: push to GitHub → Render auto-builds from Dockerfile
# ============================================================

services:
  - type: web
    name: ragent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Qdrant Cloud
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # LLM (Gemini primary, Groq fallback)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Reranker ("local" = in-process ONNX cross-encoder, "voyage" = HTTP API)
      - key: RERANKER_PROVIDER
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # External APIs
      - key: TAVILY_API_KEY
        sync: false
      - key: GAMESPOT_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      # Tracing (Langfuse, optional — no-op if unset)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
