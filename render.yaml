# ============================================================
# RAGent — Render Infrastructure-as-Code
# ============================================================
# Deploy: push to GitHub → Render auto-builds from Dockerfile
# ============================================================

services:
  - type: web
    name: ragent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Qdrant Cloud
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Groq LLM
      - key: GROQ_API_KEY
        sync: false
      # Modal (dense embedding + reranking services)
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      # External APIs
      - key: TAVILY_API_KEY
        sync: false
      - key: GAMESPOT_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      # Tracing (Langfuse, optional — no-op if unset)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
