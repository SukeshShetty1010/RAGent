# ============================================================
# RAGent — Render Infrastructure-as-Code
# ============================================================
# Deploy: push to GitHub → Render auto-builds from Dockerfile
# ============================================================

services:
  - type: web
    name: ragent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Qdrant Cloud
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # LLM (Gemini primary, Groq fallback). GEMINI_MODEL/GROQ_MODEL are
      # optional overrides — set them here to swap a retired or
      # quota-limited model without a redeploy of the code.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Reranker: "local" (in-process ONNX), "cloudflare" (Workers AI),
      # "hfspace" (HF Docker Space, same model as local), or "voyage"
      - key: RERANKER_PROVIDER
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: HF_RERANK_URL
        sync: false
      - key: HF_RERANK_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # External APIs
      - key: TAVILY_API_KEY
        sync: false
      - key: GAMESPOT_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      # Tracing (Langfuse, optional — no-op if unset)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
