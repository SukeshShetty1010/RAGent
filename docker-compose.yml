version: '3.8'

services:
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: weaviate
    ports:
      - "8080:8080"  # Maps host port 8080 to container port 8080
      - "50051:50051"  # gRPC port for potential future use
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'  # No API key for local
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'  # We'll use external SentenceTransformer
      ENABLE_MODULES: ''  # Optional for hybrid features
    volumes:
      - weaviate_data:/var/lib/weaviate  # Persist data
    restart: unless-stopped

volumes:
  weaviate_data: