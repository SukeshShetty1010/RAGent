# docker-compose.yml
version: '3.8'

services:
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: weaviate
    ports:
      - "8080:8080"   # HTTP API
      - "50051:50051" # gRPC (optional)

    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'  # External GPU embeddings
      ENABLE_MODULES: ''
      CLUSTER_GOSSIP_BIND_PORT: 7000
      CLUSTER_DATA_BIND_PORT: 7001
      WEAVIATE_SERVER_MAX_MEMORY: 8G

    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

    # Conditional GPU settings (controlled via environment variables)
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${DEVICE_DRIVER:-none}
              count: ${DEVICE_COUNT:-0}
              capabilities:
                - ${DEVICE_CAPABILITY:-cpu}
    # Optional: Pin to GPU-enabled node
    # placement:
    #   constraints: [node.labels.gpu == true]

  # Optional: GPU-accelerated embedding service (future)
  # embedder:
  #   image: ghcr.io/huggingface/text-embeddings-inference:latest
  #   ports:
  #     - "8081:80"
  #   environment:
  #     - MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  weaviate_data:
    driver: local