name: Render keepalive

# Render's free tier spins the web service down after ~15 min idle,
# so the next real request eats a cold-start. This pings the public
# /ping endpoint (api/main.py) every 10 minutes to keep it warm.
# No secrets needed — /ping is unauthenticated by design.
#
# The same cron also pings the HF Space reranker (hf_space/), which
# sleeps after 48h idle on free CPU Basic — a 10-minute interval keeps
# it far clear of that threshold. Its /health endpoint is likewise
# unauthenticated. That ping is best-effort: RAGent's retrieval path is
# fail-soft around the reranker, so a sleeping Space degrades a query,
# it does not break one — and it must never fail the Render ping job.
#
# Note: GitHub disables scheduled workflows after 60 days with no
# commits to the repo — a push resets that clock.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RAGent /ping endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://rag-ent.onrender.com/ping")
          echo "RAGent responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render keepalive ping failed (HTTP $status)"
            exit 1
          fi

      - name: Ping HF Space reranker /health endpoint
        # Skipped entirely until the HF_RERANK_URL repo variable is set,
        # so the job stays green before the Space exists.
        if: vars.HF_RERANK_URL != ''
        continue-on-error: true
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "${{ vars.HF_RERANK_URL }}/health")
          echo "Reranker Space responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Reranker Space keepalive ping failed (HTTP $status)"
          fi
