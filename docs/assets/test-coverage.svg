<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #e2e2e2; stroke-width: 1; }
    .axis { stroke: #888888; stroke-width: 1; }
    .label { fill: #444444; font-size: 12px; }
    .value { fill: #333333; font-size: 10.5px; }
    .added { fill: #2f855a; font-size: 10.5px; font-weight: 600; }
    .title { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .before { fill: #c8c8c8; }
    .after { fill: #2b6cb0; }
    .legend-text { fill: #444444; font-size: 11px; }
    .cost-box { fill: #f5f5f5; stroke: #d8d8d8; }
    .cost-text { fill: #1a1a1a; font-size: 12px; }
    .cost-sub { fill: #666666; font-size: 10.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a1a; }
      .grid { stroke: #333333; }
      .axis { stroke: #777777; }
      .label { fill: #cccccc; }
      .value { fill: #dddddd; }
      .added { fill: #68d391; }
      .title { fill: #f0f0f0; }
      .before { fill: #4a4a4a; }
      .after { fill: #63b3ed; }
      .legend-text { fill: #cccccc; }
      .cost-box { fill: #242424; stroke: #3a3a3a; }
      .cost-text { fill: #f0f0f0; }
      .cost-sub { fill: #999999; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="640" height="400"/>
  <text class="title" x="20" y="24">Test files by area, before vs. after this pass (2026-08-24)</text>

  <g>
    <line class="grid" x1="60" y1="300" x2="600" y2="300"/>
    <line class="grid" x1="60" y1="232.5" x2="600" y2="232.5"/>
    <line class="grid" x1="60" y1="165" x2="600" y2="165"/>
    <line class="grid" x1="60" y1="97.5" x2="600" y2="97.5"/>
    <line class="grid" x1="60" y1="30" x2="600" y2="30"/>
    <text class="label" x="40" y="304" text-anchor="end">0</text>
    <text class="label" x="40" y="236.5" text-anchor="end">2</text>
    <text class="label" x="40" y="169" text-anchor="end">4</text>
    <text class="label" x="40" y="101.5" text-anchor="end">6</text>
    <text class="label" x="40" y="34" text-anchor="end">8</text>
  </g>
  <line class="axis" x1="60" y1="300" x2="600" y2="300"/>
  <line class="axis" x1="60" y1="30" x2="60" y2="300"/>

  <!-- frontend/: before 0, after 3 -->
  <text class="value" x="130" y="296" text-anchor="middle">0</text>
  <rect class="after" x="155" y="198.75" width="30" height="101.25"/>
  <text class="value" x="170" y="191.75" text-anchor="middle">3</text>
  <text class="added" x="170" y="212" text-anchor="middle">+53 tests</text>
  <text class="label" x="150" y="318" text-anchor="middle">frontend/</text>

  <!-- KPI/: before 0, after 6 -->
  <text class="value" x="300" y="296" text-anchor="middle">0</text>
  <rect class="after" x="325" y="97.5" width="30" height="202.5"/>
  <text class="value" x="340" y="90.5" text-anchor="middle">6</text>
  <text class="added" x="340" y="111" text-anchor="middle">+13 tests</text>
  <text class="label" x="320" y="318" text-anchor="middle">KPI/</text>

  <!-- evaluation/: before 2, after 8 -->
  <rect class="before" x="455" y="232.5" width="30" height="67.5"/>
  <text class="value" x="470" y="225.5" text-anchor="middle">2</text>
  <rect class="after" x="495" y="30" width="30" height="270"/>
  <text class="value" x="510" y="23" text-anchor="middle">8</text>
  <text class="added" x="510" y="43" text-anchor="middle">+46 tests</text>
  <text class="label" x="490" y="318" text-anchor="middle">evaluation/</text>

  <g transform="translate(60,348)">
    <rect class="before" x="0" y="-10" width="16" height="16"/>
    <text class="legend-text" x="22" y="4">Test files before</text>
    <rect class="after" x="160" y="-10" width="16" height="16"/>
    <text class="legend-text" x="182" y="4">Test files after</text>
  </g>

  <g transform="translate(60,360)">
    <rect class="cost-box" x="0" y="0" width="540" height="34" rx="4"/>
    <text class="cost-text" x="14" y="15">18 new test files, 112 new tests — pytest suite now 46 files / 348 passed, Vitest 3 files / 53 tests</text>
    <text class="cost-sub" x="14" y="29">frontend/ and KPI/ had zero test files before this pass; evaluation/'s 2 pre-existing files gain 6 more</text>
  </g>
</svg>
